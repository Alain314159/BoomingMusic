name: Strict CI - Quality Gate

on:
  push:
    branches: [ "master", "stable" ]
  pull_request:
    branches: [ "master", "stable" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
  _JAVA_OPTIONS: "-Xmx4g"

jobs:
  kotlin-compile-check:
    name: "Kotlin Compilation"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew clean compileDebugKotlin --no-daemon -Pksp.incremental=false
      - name: Upload compilation report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-compile-report
          path: |
            **/build/reports/
            **/build/outputs/

  lint-strict:
    name: "Strict Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: kotlin-compile-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew lintDebug --no-daemon -Pksp.incremental=false
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.sarif
          retention-days: 7
          if-no-files-found: warn
      - name: Publish lint results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
        continue-on-error: true

  build-debug:
    name: "Build Debug APK"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-strict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon -Pksp.incremental=false
      - name: Verify APK exists
        run: test -n "$(find app/build/outputs/apk/debug -name '*-debug.apk' -type f)" || (echo "No debug APK found" && exit 1)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  code-quality:
    name: "Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: kotlin-compile-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew dependencyUpdates --no-daemon
        continue-on-error: true

  quality-gate-summary:
    name: "Quality Gate Summary"
    runs-on: ubuntu-latest
    needs: [kotlin-compile-check, lint-strict, build-debug, code-quality]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kotlin Compilation | ${{ needs.kotlin-compile-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Strict Lint | ${{ needs.lint-strict.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Debug | ${{ needs.build-debug.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.kotlin-compile-check.result }}" != "success" ] || \
             [ "${{ needs.lint-strict.result }}" != "success" ] || \
             [ "${{ needs.build-debug.result }}" != "success" ]; then
            echo "❌ **Quality Gate FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Quality Gate PASSED**" >> $GITHUB_STEP_SUMMARY
          fi
