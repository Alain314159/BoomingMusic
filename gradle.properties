# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Build Cache & Parallel Processing
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

# Local development: Optimized for 8GB systems (Codespaces)
# CI will override via GRADLE_OPTS
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin Optimization
kotlin.code.style=official
kotlin.caching.enabled=true
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true

# Android Optimization
# https://developer.android.com/studio/build/optimize-your-build#use-non-transitive-r-classes
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.useAndroidX=true